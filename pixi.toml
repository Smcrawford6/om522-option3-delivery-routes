[workspace]
name = "om522-option3-routes"
version = "1.0.0"
description = "OM 522 option 3 decision tool: delivery routes under capacity, time windows, and shift length."
authors = ["Sadie Crawford", "Zacc Gleason", "Annabelle Kemp"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
matplotlib-base = ">=3.8"
pytest = ">=8.0"

[tasks]
# The graded command: researched method, default settings.
solve = "python -m vrptw solve"
# The rule to beat through the same input/output contract.
rule = "python -m vrptw solve --method rule"
# Independent checker: reads only the input files and a decision file.
check = "python -m vrptw check"
compare = "python -m vrptw compare"
stress = "python -m vrptw stress"
test = "pytest -q"
# README figures and the website (docs/) from the saved results; `traces`
# reruns the researched method once per instance to record its convergence.
traces = "python -m vrptw traces"
site = "python -m vrptw site"
# Regenerates every submitted table and figure (scenarios first), the
# convergence traces, the README figures, and the website data.
reproduce = "python -m vrptw reproduce && python presentation/build.py"

# Rebuilds presentation/slides.html and presentation/script.html from results/.
presentation = "python presentation/build.py"

# --- Live-demo notebook (separate environment; the graded commands never use it) ---
# `pixi run demo` opens demo/live_demo.py in marimo in its own "demo"
# environment. The default environment used by solve, rule, check, test, and
# reproduce is unchanged.
[feature.demo.dependencies]
marimo = ">=0.9"

[feature.demo.tasks]
demo = "marimo edit demo/live_demo.py"
demo-app = "marimo run demo/live_demo.py"

[environments]
demo = ["demo"]
